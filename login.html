<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Refúgio Patas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/login.js" defer></script>
</head>

<body>

    <header>
        <nav class="nav wrap">
            <div class="brand">
                <img class="logo" src="data/img/pata.png" alt="">
                <span class="logo-word">Refúgio <span>Patas</span></span>
            </div>
        </nav>
    </header>


    <main class="login-main">

        <section class="login-card">

            <div class="login-icon">
                <img class="logo" src="data/img/pata.png" alt="">
            </div>

            <h1>Bem-vindo!</h1>

            <p class="login-description">
                Entre na sua conta para continuar.
            </p>

            <form id="loginForm">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" placeholder="admin@gmail.com" required>

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input type="password" id="senha" placeholder="Digite sua senha" required>

                </div>


                <button type="submit" class="btn-login">
                    Entrar
                </button>

                <p id="mensagem"></p>

            </form>

            <div class="login-footer">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a href=>
                    cadastrar-se
                </a>

            </div>

        </section>

    </main>


    <footer class="footer">

        <p>
            © 2026 Refúgio Patas. Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
